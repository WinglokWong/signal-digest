<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Signal Digest{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='feedback.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='subscribers.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='redesign.css') }}">
  <script src="{{ url_for('static', filename='dashboard.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">S</span><div><strong>Signal Digest</strong><span>智能资讯分发中心</span></div></div>
    {% if session.logged_in %}<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="ghost logout-button">退出登录</button></form>{% endif %}
  </header>
  <main>
    {% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
